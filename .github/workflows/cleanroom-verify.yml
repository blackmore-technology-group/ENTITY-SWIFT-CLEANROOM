name: Clean-room verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sealed conformance kit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('conformance-kit')
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              if not line.strip(): continue
              expected, rel = line.split('  ', 1)
              actual = hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if actual != expected: raise SystemExit(f'checksum mismatch: {rel}')
          print('sealed conformance kit: SHA256SUMS PASS')
          PY
      - name: Fetch sealed v3.2 adoption kit
        run: |
          mkdir -p adoption-conformance-kit
          curl -fsSL -o adoption-conformance-kit/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/ee3587a6e65c2565eaab2e815e85415ab705ea47/protocol/v3/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json
          echo '44e7a00f910c89aced3b3c1b5e9cba486809ca313e9bfb4b7bc9266095c10c14  adoption-conformance-kit/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json' | shasum -a 256 -c -
      - name: Fetch sealed v3.3 reality kit
        shell: bash
        run: |
          mkdir -p reality-conformance-kit
          curl -fsSL -o reality-conformance-kit/ENTITY_V3_3_REALITY_CLEANROOM_KIT.min.json https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/9c79f987207592cb6791e1a8956f23351cdfb2d3/protocol/v3/ENTITY_V3_3_REALITY_CLEANROOM_KIT.min.json
          echo 'f8b39ee01fb7346f33a57530e925b545d2bf9a770c7ec60724e28a4971d55a46  reality-conformance-kit/ENTITY_V3_3_REALITY_CLEANROOM_KIT.min.json' | shasum -a 256 -c -
      - name: Fetch sealed v3.4 global passport kit
        shell: bash
        run: |
          mkdir -p passport-conformance-kit
          curl -fsSL -o passport-conformance-kit/ENTITY_V3_4_GLOBAL_PASSPORT_CLEANROOM_KIT.min.json https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/c143ccc14def335635e7d0248353167e4956e977/protocol/v3/ENTITY_V3_4_GLOBAL_PASSPORT_CLEANROOM_KIT.min.json
          echo '5869a3fd0ed6cb9f65bf4b20c3bd64933cad82f4aef05c5809e2e05af921f230  passport-conformance-kit/ENTITY_V3_4_GLOBAL_PASSPORT_CLEANROOM_KIT.min.json' | shasum -a 256 -c -
      - name: Toolchain
        run: swift --version
      - name: Compile and run campaigns
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence-ci
          swift run -c release EntitySwiftCleanroom test | tee evidence-ci/cleanroom-report.json
          swift run -c release AdoptionV32 | tee evidence-ci/adoption-v3.2-report.json
          grep -q '"vectors_passed" : 16' evidence-ci/adoption-v3.2-report.json || grep -q '"vectors_passed": 16' evidence-ci/adoption-v3.2-report.json
          grep -q '1eb59e09ab08da86bfd8584df4a64ba331f7bbbce3d236b9b94f351606c90e18' evidence-ci/adoption-v3.2-report.json
          grep -q '"overall_valid" : true' evidence-ci/adoption-v3.2-report.json || grep -q '"overall_valid": true' evidence-ci/adoption-v3.2-report.json
          shasum -a 256 evidence-ci/cleanroom-report.json evidence-ci/adoption-v3.2-report.json > evidence-ci/reports.sha256
          git rev-parse HEAD > evidence-ci/commit.txt
      - name: Run v3.3 reality campaign
        shell: bash
        run: |
          set -o pipefail
          swift run -c release RealityV33 | tee evidence-ci/reality-v3.3-report.json
          grep -q '"vectors_passed" : 20' evidence-ci/reality-v3.3-report.json || grep -q '"vectors_passed": 20' evidence-ci/reality-v3.3-report.json
          grep -q '82bd1f1fb328edd37a26d8ea60ede5a599c7d9af5027bffd73b9e52843b5a51d' evidence-ci/reality-v3.3-report.json
          grep -q '"overall_valid" : true' evidence-ci/reality-v3.3-report.json || grep -q '"overall_valid": true' evidence-ci/reality-v3.3-report.json
      - name: Run v3.4.2 global passport campaign
        shell: bash
        run: |
          set -o pipefail
          swift run -c release PassportV34 | tee evidence-ci/passport-v3.4.2-report.json
          grep -q '"vectors_passed" : 26' evidence-ci/passport-v3.4.2-report.json || grep -q '"vectors_passed": 26' evidence-ci/passport-v3.4.2-report.json
          grep -q '45af773554a7191c1b49a75c636a1106afb1de36d788bb00d7af56097b8d1b0e' evidence-ci/passport-v3.4.2-report.json
          grep -q '"overall_valid" : true' evidence-ci/passport-v3.4.2-report.json || grep -q '"overall_valid": true' evidence-ci/passport-v3.4.2-report.json
          shasum -a 256 evidence-ci/passport-v3.4.2-report.json >> evidence-ci/reports.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: entity-swift-cleanroom-evidence
          path: evidence-ci/
          retention-days: 90
